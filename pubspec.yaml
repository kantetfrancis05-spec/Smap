name: smap
description: "SMAP - Smart Attendance App with BLE, Facial Verification & Anomaly Detection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.3.1
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.11.0
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
